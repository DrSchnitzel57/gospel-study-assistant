services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    ports:
      - "3000:3000"
    env_file:
      - .env
    volumes:
      # Read-only view of the ingest volume so the Status page can report what
      # has been downloaded (files on disk) vs ingested (rows in Postgres).
      - ingestdata:/app/ingestdata:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/auth/session"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  db:
    image: pgvector/pgvector:pg16
    environment:
      - POSTGRES_DB=gospel_db
      - POSTGRES_USER=gospel
      - POSTGRES_PASSWORD=gospelpass
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gospel -d gospel_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  ingest:
    build:
      context: .
      dockerfile: Dockerfile.ingest
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ingestdata:/app/data
    restart: "no"

volumes:
  pgdata:
  ingestdata:
