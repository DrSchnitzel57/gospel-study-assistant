services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    ports:
      - "3000:3000"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: pgvector/pgvector:pg16
    environment:
      - POSTGRES_DB=gospel_db
      - POSTGRES_USER=gospel
      - POSTGRES_PASSWORD=gospelpass
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gospel -d gospel_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  ingest:
    build:
      context: .
      dockerfile: Dockerfile.ingest
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ingestdata:/app/data
    restart: "no"

volumes:
  pgdata:
  ingestdata:
